<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cardápio TremBão</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body class="tela-login">

  <div class="login-caixa">
    <div class="logo-badge"><img src="../assets/logo.png" alt="Logo do trailer"></div>
    <h1>Painel TremBão</h1>

    <label class="campo-label" for="input-email">E-mail</label>
    <input type="email" id="input-email" class="campo-input" placeholder="seuemail@exemplo.com">

    <label class="campo-label" for="input-senha">Senha</label>
    <input type="password" id="input-senha" class="campo-input" placeholder="Sua senha">

    <p id="erro-login" class="erro-cliente oculto"></p>

    <button id="btn-login" class="btn-primario">Entrar</button>

    <a href="/index.html" class="link-admin">← Voltar pro cardápio</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="login.js"></script>

</body>
</html>
