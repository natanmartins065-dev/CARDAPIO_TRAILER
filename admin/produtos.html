<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Produtos</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body class="tela-painel">

  <a href="cardapio.html" class="btn-voltar-secao">← Voltar</a>

  <section class="secao-produtos">
    <h2>🥤 Produtos</h2>

    <form id="form-produto" class="form-produto">
      <select id="select-categoria-produto" class="campo-input" required>
        <option value="">Categoria...</option>
      </select>
      <input type="text" id="input-nome-produto" class="campo-input" placeholder="Nome do produto" required>
      <input type="text" id="input-descricao-produto" class="campo-input" placeholder="Descrição (opcional)">
      <input type="number" id="input-preco-produto" class="campo-input" placeholder="Preço (ex: 22.00)" step="0.01" min="0" required>
      <button type="submit" class="btn-primario btn-avancar">Adicionar produto</button>
    </form>

    <div id="lista-produtos" class="lista-produtos">
      <p class="carregando">Carregando produtos...</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="produtos.js"></script>

</body>
</html>
